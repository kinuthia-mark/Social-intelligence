name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Django API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    name: Next.js type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Full stack in Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Wait for the frontend
        run: |
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      # Sign in through Next.js, then read data that Next proxies from Django.
      - name: Sign in and fetch KPIs through the proxy
        run: |
          curl -fs -c jar.txt -H "Content-Type: application/json" \
            -d '{"email":"ochiengs@vela.co","password":"vela-demo-2026"}' \
            http://localhost:3000/api/auth/login
          curl -fs -b jar.txt http://localhost:3000/api/kpis | grep -q "value"
          curl -fs -b jar.txt -H "Content-Type: application/json" \
            -d '{"text":"Got sick after the Berry batch, is there a recall?"}' \
            http://localhost:3000/api/post-analysis | grep -q '"label":"negative"'
      - name: Logs
        if: always()
        run: docker compose logs
